<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .timer-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .time-remaining {
            font-size: 4em;
            color: #667eea;
            font-weight: bold;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }

        .slider-container {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: 500;
        }

        .slider {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        .duration-display {
            text-align: center;
            margin-top: 10px;
            font-size: 1.2em;
            color: #667eea;
        }

        .sound-selection {
            margin-bottom: 30px;
        }

        .sound-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
            padding: 5px;
        }

        .sound-btn {
            flex: 1 1 calc(50% - 5px);
            min-width: 120px;
            padding: 12px 10px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 0.95em;
            position: relative;
        }

        .sound-btn:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .sound-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .sound-btn .preview-icon {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.6;
            font-size: 0.9em;
        }

        .no-sounds {
            text-align: center;
            padding: 20px;
            color: #999;
            font-style: italic;
            background: #f5f5f5;
            border-radius: 10px;
            margin-top: 10px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            gap: 10px;
        }

        .checkbox-container input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .start-btn {
            background: #667eea;
            color: white;
        }

        .start-btn:hover:not(:disabled) {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .start-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .stop-btn {
            background: #f56565;
            color: white;
        }

        .stop-btn:hover:not(:disabled) {
            background: #e53e3e;
            transform: translateY(-2px);
        }

        .stop-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            text-align: center;
            margin-top: 20px;
            font-size: 1.1em;
            color: #667eea;
            min-height: 30px;
        }

        .connection-status {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.85em;
            background: #f0f0f0;
        }

        .connection-status.connected {
            background: #c6f6d5;
            color: #22543d;
        }

        .connection-status.disconnected {
            background: #fed7d7;
            color: #742a2a;
        }

        .volume-control {
            margin-bottom: 20px;
        }

        .volume-slider {
            width: 100%;
            height: 6px;
            margin-top: 10px;
        }

        .volume-display {
            text-align: center;
            margin-top: 5px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="connection-status disconnected" id="connectionStatus">Disconnected</div>
    
    <div class="container">
        <h1>⏰ Sound Timer</h1>
        
        <div class="timer-display">
            <div class="time-remaining" id="timeDisplay">00:00</div>
        </div>

        <div class="slider-container">
            <label for="durationSlider">Timer Duration</label>
            <input type="range" id="durationSlider" class="slider" min="1" max="60" value="5">
            <div class="duration-display" id="durationDisplay">5 minutes</div>
        </div>

        <div class="sound-selection">
            <label>Notification Sound</label>
            <div id="soundContainer">
                <div class="no-sounds">No sound files found. Add audio files to the sounds folder.</div>
            </div>
        </div>

        <div class="volume-control">
            <label for="volumeSlider">Volume</label>
            <input type="range" id="volumeSlider" class="slider volume-slider" min="0" max="100" value="70">
            <div class="volume-display" id="volumeDisplay">70%</div>
        </div>

        <div class="checkbox-container">
            <input type="checkbox" id="repeatCheckbox">
            <label for="repeatCheckbox">Repeat timer automatically</label>
        </div>

        <div class="controls">
            <button class="control-btn start-btn" id="startBtn" disabled>Start Timer</button>
            <button class="control-btn stop-btn" id="stopBtn" disabled>Stop Timer</button>
        </div>

        <div class="status" id="status">Loading sounds...</div>
    </div>

    <script>
        // Initialize Socket.IO connection
        const socket = io();
        
        // Timer state
        let timerInterval = null;
        let endTime = null;
        let selectedSound = null;
        let isRunning = false;
        let availableSounds = [];
        let currentAudio = null;

        // DOM elements
        const durationSlider = document.getElementById('durationSlider');
        const durationDisplay = document.getElementById('durationDisplay');
        const timeDisplay = document.getElementById('timeDisplay');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const repeatCheckbox = document.getElementById('repeatCheckbox');
        const status = document.getElementById('status');
        const soundContainer = document.getElementById('soundContainer');
        const connectionStatus = document.getElementById('connectionStatus');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeDisplay = document.getElementById('volumeDisplay');

        // Socket.IO event handlers
        socket.on('connect', () => {
            connectionStatus.textContent = 'Connected';
            connectionStatus.className = 'connection-status connected';
            status.textContent = 'Connected to server';
        });

        socket.on('disconnect', () => {
            connectionStatus.textContent = 'Disconnected';
            connectionStatus.className = 'connection-status disconnected';
            status.textContent = 'Disconnected from server';
            startBtn.disabled = true;
        });

        socket.on('sounds-updated', (sounds) => {
            availableSounds = sounds;
            updateSoundButtons();
            
            if (sounds.length > 0) {
                status.textContent = `${sounds.length} sound(s) available`;
                startBtn.disabled = false;
                
                // Auto-select first sound if none selected
                if (!selectedSound && sounds.length > 0) {
                    selectedSound = sounds[0];
                }
            } else {
                status.textContent = 'No sounds available. Add audio files to the sounds folder.';
                startBtn.disabled = true;
                selectedSound = null;
            }
        });

        // Update duration display when slider changes
        durationSlider.addEventListener('input', () => {
            const minutes = durationSlider.value;
            durationDisplay.textContent = `${minutes} minute${minutes > 1 ? 's' : ''}`;
            if (!isRunning) {
                updateTimeDisplay(minutes * 60);
            }
        });

        // Update volume display
        volumeSlider.addEventListener('input', () => {
            volumeDisplay.textContent = `${volumeSlider.value}%`;
            if (currentAudio) {
                currentAudio.volume = volumeSlider.value / 100;
            }
        });

        // Start/Stop timer handlers
        startBtn.addEventListener('click', startTimer);
        stopBtn.addEventListener('click', stopTimer);

        // Initialize display
        updateTimeDisplay(durationSlider.value * 60);

        function updateSoundButtons() {
            if (availableSounds.length === 0) {
                soundContainer.innerHTML = '<div class="no-sounds">No sound files found. Add audio files to the sounds folder.</div>';
                return;
            }

            const buttonsHtml = availableSounds.map(sound => {
                const isActive = selectedSound && selectedSound.filename === sound.filename;
                return `
                    <button class="sound-btn ${isActive ? 'active' : ''}" 
                            data-filename="${sound.filename}" 
                            data-path="${sound.path}"
                            onclick="selectSound(this)">
                        ${sound.name}
                        <span class="preview-icon">▶</span>
                    </button>
                `;
            }).join('');

            soundContainer.innerHTML = `<div class="sound-buttons">${buttonsHtml}</div>`;
        }

        function selectSound(button) {
            // Update active state
            document.querySelectorAll('.sound-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            button.classList.add('active');

            // Update selected sound
            const filename = button.dataset.filename;
            selectedSound = availableSounds.find(s => s.filename === filename);

            // Preview the sound
            playSound(true);
        }

        function playSound(preview = false) {
            if (!selectedSound) {
                console.error('No sound selected');
                return;
            }

            // Stop any currently playing audio
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            // Create and play new audio
            currentAudio = new Audio(selectedSound.path);
            currentAudio.volume = (preview ? 0.3 : 1) * (volumeSlider.value / 100);
            
            currentAudio.play().catch(error => {
                console.error('Error playing sound:', error);
                status.textContent = 'Error playing sound. Check file format.';
            });

            currentAudio.onended = () => {
                currentAudio = null;
            };
        }

        function startTimer() {
            if (!selectedSound) {
                status.textContent = 'Please select a sound first';
                return;
            }

            const durationMinutes = parseInt(durationSlider.value);
            const durationSeconds = durationMinutes * 60;
            
            endTime = Date.now() + (durationSeconds * 1000);
            isRunning = true;
            
            startBtn.disabled = true;
            stopBtn.disabled = false;
            durationSlider.disabled = true;
            
            status.textContent = 'Timer running...';
            
            timerInterval = setInterval(updateTimer, 100);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            endTime = null;
            isRunning = false;
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
            durationSlider.disabled = false;
            
            status.textContent = 'Timer stopped';
            updateTimeDisplay(durationSlider.value * 60);
        }

        function updateTimer() {
            const now = Date.now();
            const remaining = Math.max(0, endTime - now);
            const seconds = Math.ceil(remaining / 1000);
            
            updateTimeDisplay(seconds);
            
            if (remaining <= 0) {
                timerComplete();
            }
        }

        function timerComplete() {
            playSound(false);
            
            if (repeatCheckbox.checked) {
                status.textContent = 'Timer complete! Restarting...';
                setTimeout(() => {
                    startTimer();
                }, 1000);
            } else {
                stopTimer();
                status.textContent = 'Timer complete!';
            }
        }

        function updateTimeDisplay(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            timeDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // Load initial sounds
        fetch('/api/sounds')
            .then(response => response.json())
            .then(sounds => {
                availableSounds = sounds;
                updateSoundButtons();
                if (sounds.length > 0) {
                    selectedSound = sounds[0];
                    startBtn.disabled = false;
                }
            })
            .catch(error => {
                console.error('Error loading sounds:', error);
                status.textContent = 'Error connecting to server';
            });
    </script>
</body>
</html>
